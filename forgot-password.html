<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sweet & Sour · Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <style>
        .auth-card .brand h2 span { color: var(--primary-blue); }
        .info-text { color: var(--gray-500); font-size: 0.85rem; text-align: center; margin-bottom: 1.2rem; }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="brand">
                <img src="logo.png" alt="Sweet & Sour" class="logo" onerror="this.style.display='none'" />
                <h2>Sweet <span>&amp;</span> Sour</h2>
                <p>Reset your password</p>
            </div>

            <p class="info-text">Enter your email address and we'll send you a link to reset your password.</p>

            <form id="resetForm">
                <div class="form-group"><label for="email">Email Address</label><input type="email" id="email" placeholder="your@email.com" required /></div>
                <button type="submit" class="auth-btn" id="resetBtn">
                    <span class="spinner"></span>
                    <span class="btn-text">Send Reset Link</span>
                </button>
            </form>

            <div class="auth-footer">Remember your password? <a href="login.html">Sign In</a></div>
        </div>
    </div>

    <div class="toast-container" id="toast"></div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js"
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from 'firebase/app';
        import { getAuth, sendPasswordResetEmail } from 'firebase/auth';

        const firebaseConfig = {
            apiKey: "AIzaSyAfGWLLJ-bmMrbkhLkdwhxIo2QrW7mYKQA",
            authDomain: "sweet-and-sour-aa364.firebaseapp.com",
            projectId: "sweet-and-sour-aa364",
            storageBucket: "sweet-and-sour-aa364.firebasestorage.app",
            messagingSenderId: "1046434031562",
            appId: "1:1046434031562:web:b325998964afbfe4105133"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const form = document.getElementById('resetForm');
        const resetBtn = document.getElementById('resetBtn');
        const toast = document.getElementById('toast');
        let toastTimer = null;

        function showToast(message, type = 'success') {
            toast.textContent = message;
            toast.className = `toast-container ${type}`;
            toast.style.display = 'block';
            requestAnimationFrame(() => toast.classList.add('show'));
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.style.display = 'none', 400); }, 3000);
        }

        function setLoading(loading) {
            if (loading) { resetBtn.classList.add('btn-loading'); resetBtn.disabled = true; }
            else { resetBtn.classList.remove('btn-loading'); resetBtn.disabled = false; }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            if (!email) { showToast('Please enter your email address', 'error'); return; }
            setLoading(true);
            try {
                await sendPasswordResetEmail(auth, email);
                showToast('Password reset link sent! Check your email.', 'success');
                setTimeout(() => { window.location.href = 'login.html'; }, 2500);
            } catch (error) {
                let message = 'Failed to send reset link. Please try again.';
                if (error.code === 'auth/user-not-found') message = 'No account found with this email.';
                else if (error.code === 'auth/invalid-email') message = 'Invalid email address.';
                else if (error.code === 'auth/too-many-requests') message = 'Too many requests. Please try again later.';
                showToast(message, 'error');
                setLoading(false);
            }
        });
    </script>
</body>
</html>
