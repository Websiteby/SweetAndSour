        function showAnnouncementForm(announcementId = null) {
            const item = announcementId ? allAnnouncements.find(a => a.id === announcementId) : null;
            const modalHtml = `
                <form id="announcementForm" class="admin-form">
                    <div class="form-group full"><label for="aTitle">Title *</label><input type="text" id="aTitle" value="${item?.title || ''}" required /></div>
                    <div class="form-group full"><label for="aMessage">Message *</label><textarea id="aMessage" rows="4" required>${item?.message || ''}</textarea></div>
                    <div class="form-group"><label for="aColor">Banner Color</label>
                        <select id="aColor">
                            <option value="blue" ${item?.color === 'blue' || !item?.color ? 'selected' : ''}>Blue (Default)</option>
                            <option value="orange" ${item?.color === 'orange' ? 'selected' : ''}>Orange</option>
                            <option value="green" ${item?.color === 'green' ? 'selected' : ''}>Green</option>
                        </select>
                    </div>
                    <div class="form-group"><label for="aStatus">Status</label>
                        <select id="aStatus"><option value="active" ${item?.isActive !== false ? 'selected' : ''}>Active</option><option value="inactive" ${item?.isActive === false ? 'selected' : ''}>Inactive</option></select>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary">${announcementId ? 'Update' : 'Create'} Announcement</button>
                        <button type="button" class="btn-secondary" onclick="document.getElementById('adminModal').classList.remove('active');document.body.style.overflow='';">Cancel</button>
                    </div>
                </form>
            `;
            openModal(`${announcementId ? 'Edit' : 'Add'} Announcement`, modalHtml);

            document.getElementById('announcementForm')?.addEventListener('submit', async function(e) {
                e.preventDefault();
                const title = document.getElementById('aTitle').value.trim();
                const message = document.getElementById('aMessage').value.trim();
                const color = document.getElementById('aColor').value;
                const isActive = document.getElementById('aStatus').value === 'active';
                if (!title || !message) { showToast('Title and message are required', 'error'); return; }
                const data = { title, message, color, isActive, updatedAt: Timestamp.now() };
                try {
                    if (announcementId) { await updateDoc(doc(db, 'announcements', announcementId), data); showToast('Announcement updated!', 'success'); }
                    else { data.createdAt = Timestamp.now(); await addDoc(collection(db, 'announcements'), data); showToast('Announcement created!', 'success'); }
                    closeModal();
                } catch (error) { showToast('Error saving announcement', 'error'); }
            });
        }

        /* ==================== MONTHLY REPORTS ==================== */
        function renderReports() {
            const now = new Date();
            const monthOptions = [];
            for (let i = 0; i < 12; i++) {
                const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                const val = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                const label = d.toLocaleString('default', { month: 'long', year: 'numeric' });
                monthOptions.push(`<option value="${val}" ${i === 0 ? 'selected' : ''}>${label}</option>`);
            }

            const html = `
                <div class="admin-panel">
                    <div class="panel-title"><span><i class="fas fa-chart-line"></i> Monthly Reports</span></div>
                    <div style="display:flex;gap:0.8rem;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;">
                        <label style="font-weight:600;font-size:0.85rem;">Select Month:</label>
                        <select id="reportMonth" style="padding:0.4rem 0.8rem;border:2px solid var(--gray-200);border-radius:var(--radius-full);font-family:inherit;font-size:0.85rem;">
                            ${monthOptions.join('')}
                        </select>
                        <button class="btn-primary" id="generateReportBtn" style="padding:0.4rem 1.2rem;font-size:0.85rem;"><i class="fas fa-sync"></i> Generate Report</button>
                        <button class="btn-secondary" id="printReportBtn" style="padding:0.4rem 1.2rem;font-size:0.85rem;"><i class="fas fa-print"></i> Print</button>
                    </div>
                    <div id="reportOutput">
                        <p style="color:var(--gray-500);text-align:center;padding:2rem;">Select a month and click Generate Report to view statistics.</p>
                    </div>
                </div>
            `;
            renderAdminLayout(html);

            document.getElementById('generateReportBtn')?.addEventListener('click', () => {
                const monthVal = document.getElementById('reportMonth').value;
                generateMonthlyReport(monthVal);
            });
            document.getElementById('printReportBtn')?.addEventListener('click', () => {
                window.print();
            });
        }

        function generateMonthlyReport(monthVal) {
            const [year, month] = monthVal.split('-').map(Number);
            const startDate = new Date(year, month - 1, 1);
            const endDate = new Date(year, month, 0, 23, 59, 59);

            const monthOrders = allOrders.filter(o => {
                const d = o.createdAt?.toDate?.() || (o.createdAt ? new Date(o.createdAt) : null);
                if (!d) return false;
                return d >= startDate && d <= endDate;
            });

            const deliveredOrders = monthOrders.filter(o => o.status === 'delivered');
            const dispatchedOrders = monthOrders.filter(o => o.status === 'dispatched');
            const pendingOrders = monthOrders.filter(o => o.status === 'pending');
            const cancelledOrders = monthOrders.filter(o => o.status === 'cancelled');

            const totalRevenue = deliveredOrders.reduce((sum, o) => sum + (o.total || 0), 0);
            const totalItems = deliveredOrders.reduce((sum, o) => sum + (o.items?.reduce((s, i) => s + (i.qty || 1), 0) || 0), 0);

            const newUsers = allUsers.filter(u => {
                const d = u.createdAt?.toDate?.() || (u.createdAt ? new Date(u.createdAt) : null);
                if (!d) return false;
                return d >= startDate && d <= endDate;
            });

            const monthLabel = startDate.toLocaleString('default', { month: 'long', year: 'numeric' });

            const productSales = {};
            deliveredOrders.forEach(o => {
                (o.items || []).forEach(item => {
                    const key = item.name || 'Unknown';
                    if (!productSales[key]) productSales[key] = { qty: 0, revenue: 0 };
                    productSales[key].qty += (item.qty || 1);
                    productSales[key].revenue += (item.price || 0) * (item.qty || 1);
                });
            });
            const topProducts = Object.entries(productSales)
                .sort((a, b) => b[1].qty - a[1].qty)
                .slice(0, 5);

            const html = `
                <div id="reportContent" style="background:var(--white);padding:2rem;border-radius:var(--radius);border:1px solid var(--gray-200);">
                    <div style="text-align:center;margin-bottom:2rem;border-bottom:2px solid var(--primary-blue);padding-bottom:1rem;">
                        <h2 style="font-size:1.6rem;font-weight:800;color:var(--dark-text);">Sweet &amp; Sour</h2>
                        <p style="color:var(--gray-500);font-size:0.9rem;">Monthly Business Report</p>
                        <h3 style="font-size:1.2rem;font-weight:700;color:var(--primary-blue);margin-top:0.5rem;">${monthLabel}</h3>
                    </div>

                    <h4 style="font-weight:700;margin-bottom:0.8rem;color:var(--dark-text);border-left:4px solid var(--primary-blue);padding-left:0.6rem;">Sales Overview</h4>
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1.5rem;">
                        <div style="background:var(--gray-50);padding:1rem;border-radius:var(--radius-sm);text-align:center;">
                            <div style="font-size:1.8rem;font-weight:800;color:var(--primary-blue);">₹${totalRevenue.toLocaleString()}</div>
                            <div style="font-size:0.75rem;color:var(--gray-500);">Total Revenue</div>
                        </div>
                        <div style="background:var(--gray-50);padding:1rem;border-radius:var(--radius-sm);text-align:center;">
                            <div style="font-size:1.8rem;font-weight:800;color:var(--primary-blue);">${monthOrders.length}</div>
                            <div style="font-size:0.75rem;color:var(--gray-500);">Total Orders</div>
                        </div>
                        <div style="background:var(--gray-50);padding:1rem;border-radius:var(--radius-sm);text-align:center;">
                            <div style="font-size:1.8rem;font-weight:800;color:var(--accent);">${deliveredOrders.length}</div>
                            <div style="font-size:0.75rem;color:var(--gray-500);">Delivered</div>
                        </div>
                        <div style="background:var(--gray-50);padding:1rem;border-radius:var(--radius-sm);text-align:center;">
                            <div style="font-size:1.8rem;font-weight:800;color:#1E40AF;">${dispatchedOrders.length}</div>
                            <div style="font-size:0.75rem;color:var(--gray-500);">Dispatched</div>
                        </div>
                        <div style="background:var(--gray-50);padding:1rem;border-radius:var(--radius-sm);text-align:center;">
                            <div style="font-size:1.8rem;font-weight:800;color:#F59E0B;">${pendingOrders.length}</div>
                            <div style="font-size:0.75rem;color:var(--gray-500);">Pending</div>
                        </div>
                        <div style="background:var(--gray-50);padding:1rem;border-radius:var(--radius-sm);text-align:center;">
                            <div style="font-size:1.8rem;font-weight:800;color:#D32F2F;">${cancelledOrders.length}</div>
                            <div style="font-size:0.75rem;color:var(--gray-500);">Cancelled</div>
                        </div>
                        <div style="background:var(--gray-50);padding:1rem;border-radius:var(--radius-sm);text-align:center;">
                            <div style="font-size:1.8rem;font-weight:800;color:var(--primary-blue);">${totalItems}</div>
                            <div style="font-size:0.75rem;color:var(--gray-500);">Items Sold</div>
                        </div>
                    </div>

                    <h4 style="font-weight:700;margin-bottom:0.8rem;color:var(--dark-text);border-left:4px solid var(--primary-blue);padding-left:0.6rem;">Users</h4>
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1.5rem;">
                        <div style="background:var(--gray-50);padding:1rem;border-radius:var(--radius-sm);text-align:center;">
                            <div style="font-size:1.8rem;font-weight:800;color:var(--primary-blue);">${newUsers.length}</div>
                            <div style="font-size:0.75rem;color:var(--gray-500);">New Users</div>
                        </div>
                        <div style="background:var(--gray-50);padding:1rem;border-radius:var(--radius-sm);text-align:center;">
                            <div style="font-size:1.8rem;font-weight:800;color:var(--primary-blue);">${allUsers.length}</div>
                            <div style="font-size:0.75rem;color:var(--gray-500);">Total Registered Users</div>
                        </div>
                    </div>

                    <h4 style="font-weight:700;margin-bottom:0.8rem;color:var(--dark-text);border-left:4px solid var(--primary-blue);padding-left:0.6rem;">Top Selling Products</h4>
                    ${topProducts.length === 0 ? '<p style="color:var(--gray-500);font-size:0.85rem;margin-bottom:1.5rem;">No product sales data available for this month.</p>' : `
                    <table style="width:100%;border-collapse:collapse;font-size:0.85rem;margin-bottom:1.5rem;">
                        <thead>
                            <tr style="background:var(--gray-50);">
                                <th style="text-align:left;padding:0.5rem;border-bottom:1px solid var(--gray-200);font-weight:600;">Product</th>
                                <th style="text-align:right;padding:0.5rem;border-bottom:1px solid var(--gray-200);font-weight:600;">Qty Sold</th>
                                <th style="text-align:right;padding:0.5rem;border-bottom:1px solid var(--gray-200);font-weight:600;">Revenue</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${topProducts.map(([name, data]) => `
                                <tr>
                                    <td style="padding:0.5rem;border-bottom:1px solid var(--gray-100);">${name}</td>
                                    <td style="padding:0.5rem;border-bottom:1px solid var(--gray-100);text-align:right;">${data.qty}</td>
                                    <td style="padding:0.5rem;border-bottom:1px solid var(--gray-100);text-align:right;">₹${data.revenue.toLocaleString()}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    `}

                    <div style="text-align:center;margin-top:2rem;padding-top:1rem;border-top:1px solid var(--gray-200);color:var(--gray-400);font-size:0.75rem;">
                        Report generated on ${new Date().toLocaleString()} · Sweet &amp; Sour
                    </div>
                </div>
            `;
            document.getElementById('reportOutput').innerHTML = html;
        }

        /* ==================== SETTINGS ==================== */
        function renderSettings() {
            const html = `
                <div class="admin-panel">
                    <div class="panel-title"><span><i class="fas fa-cog"></i> Settings</span></div>
                    <div style="display:grid;gap:1rem;max-width:600px;">
                        <div style="background:var(--gray-50);padding:1rem;border-radius:var(--radius-sm);border:1px solid var(--gray-200);">
                            <h4 style="font-weight:700;margin-bottom:0.3rem;">Admin Information</h4>
                            <p style="font-size:0.85rem;color:var(--gray-500);">Name: ${currentUserData?.name || 'N/A'}</p>
                            <p style="font-size:0.85rem;color:var(--gray-500);">Email: ${currentUser?.email || 'N/A'}</p>
                            <p style="font-size:0.85rem;color:var(--gray-500);">Role: ${currentUserData?.role || 'N/A'}</p>
                        </div>
                        <div style="background:var(--gray-50);padding:1rem;border-radius:var(--radius-sm);border:1px solid var(--gray-200);">
                            <h4 style="font-weight:700;margin-bottom:0.3rem;">Logout</h4>
                            <p style="font-size:0.85rem;color:var(--gray-500);margin-bottom:0.5rem;">Sign out from the admin account.</p>
                            <button class="btn-primary" id="adminLogoutBtn" style="padding:0.4rem 1.5rem;font-size:0.85rem;"><i class="fas fa-sign-out-alt"></i> Logout</button>
                        </div>
                    </div>
                </div>
            `;
            renderAdminLayout(html);

            document.getElementById('adminLogoutBtn')?.addEventListener('click', async () => {
                try {
                    cleanupListeners();
                    await signOut(auth);
                    showToast('Logged out successfully', 'success');
                    setTimeout(() => { window.location.href = 'login.html'; }, 600);
                } catch (error) {
                    showToast('Error logging out', 'error');
                }
            });
        }

        /* ==================== TAB NAVIGATION ==================== */
        function switchTab(tab) {
            currentTab = tab;
            switch (tab) {
                case 'dashboard': renderDashboard(); break;
                case 'products': renderProducts(); break;
                case 'categories': renderCategories(); break;
                case 'banners': renderBanners(); break;
                case 'orders': renderOrders(); break;
                case 'users': renderUsers(); break;
                case 'reviews': renderReviews(); break;
                case 'announcements': renderAnnouncements(); break;
                case 'reports': renderReports(); break;
                case 'settings': renderSettings(); break;
                default: renderDashboard();
            }
        }

        function attachTabListeners() {
            document.querySelectorAll('.admin-nav a[data-tab]').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    switchTab(this.dataset.tab);
                });
            });
        }

        /* ==================== SAFE LISTENER ERROR HANDLER ==================== */
        function handleAdminListenerError(collectionName, error, emptySetter) {
            if (error.code === 'permission-denied') {
                console.warn(`🔒 ${collectionName}: permission denied — check admin session + rules`);
            } else if (error.code === 'failed-precondition') {
                console.warn(`⚠️ ${collectionName}: index missing — deploy firestore.indexes.json`);
            } else if (error.code === 'unavailable') {
                console.warn(`⚠️ ${collectionName}: network unavailable`);
            } else {
                console.warn(`⚠️ ${collectionName} listener error:`, error.message);
            }
            if (emptySetter) emptySetter();
            if (currentTab === collectionName.toLowerCase()) {
                switchTab(currentTab);
            } else if (currentTab === 'dashboard') {
                renderDashboard();
            }
        }

        /* ==================== FIRESTORE LISTENERS (ADMIN ONLY) ==================== */
        function setupListeners() {
            if (listenersActive) return;
            if (!adminAuthorized) {
                console.warn('🔒 Admin listeners NOT started — admin not authorized');
                return;
            }
            listenersActive = true;
            console.log('✅ Admin verified — starting listeners');

            // PRODUCTS
            if (unsubscribeProducts) { unsubscribeProducts(); unsubscribeProducts = null; }
            try {
                const qProducts = query(collection(db, 'products'));
                unsubscribeProducts = onSnapshot(qProducts, (snapshot) => {
                    allProducts = [];
                    snapshot.forEach(doc => { const data = doc.data(); allProducts.push({ id: doc.id, ...data, sku: data.sku || data.SKU || data.productSku || data.productSKU || '' }); });
                    if (currentTab === 'products') renderProducts();
                    if (currentTab === 'dashboard') renderDashboard();
                }, (error) => handleAdminListenerError('Products', error, () => { allProducts = []; }));
            } catch (error) { console.warn('Products listener setup error:', error.message); }

            // CATEGORIES
            if (unsubscribeCategories) { unsubscribeCategories(); unsubscribeCategories = null; }
            try {
                const qCategories = query(collection(db, 'categories'));
                unsubscribeCategories = onSnapshot(qCategories, (snapshot) => {
                    allCategories = [];
                    snapshot.forEach(doc => allCategories.push({ id: doc.id, ...doc.data() }));
                    allCategories.sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));
                    if (currentTab === 'categories') renderCategories();
                    if (currentTab === 'dashboard') renderDashboard();
                }, (error) => handleAdminListenerError('Categories', error, () => { allCategories = []; }));
            } catch (error) { console.warn('Categories listener setup error:', error.message); }

            // BANNERS
            if (unsubscribeBanners) { unsubscribeBanners(); unsubscribeBanners = null; }
            try {
                const qB = query(collection(db, 'banners'));
                unsubscribeBanners = onSnapshot(qB, (snapshot) => {
                    allBanners = [];
                    snapshot.forEach(doc => allBanners.push({ id: doc.id, ...doc.data() }));
                    allBanners.sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));
                    if (currentTab === 'banners') renderBanners();
                    if (currentTab === 'dashboard') renderDashboard();
                }, (error) => handleAdminListenerError('Banners', error, () => { allBanners = []; }));
            } catch (error) { console.warn('Banners listener setup error:', error.message); }

            // ORDERS (admin sees all — rules allow)
            if (unsubscribeOrders) { unsubscribeOrders(); unsubscribeOrders = null; }
            try {
                const qO = query(collection(db, 'orders'));
                unsubscribeOrders = onSnapshot(qO, (snapshot) => {
                    allOrders = [];
                    snapshot.forEach(doc => allOrders.push({ id: doc.id, ...doc.data() }));
                    allOrders.sort((a, b) => { const dA = a.createdAt?.toDate?.() || a.createdAt || 0; const dB = b.createdAt?.toDate?.() || b.createdAt || 0; return new Date(dB) - new Date(dA); });
                    if (currentTab === 'orders') renderOrders();
                    if (currentTab === 'dashboard') renderDashboard();
                }, (error) => handleAdminListenerError('Orders', error, () => { allOrders = []; }));
            } catch (error) { console.warn('Orders listener setup error:', error.message); }

            // USERS (admin only — rules allow admin read all)
            if (unsubscribeUsers) { unsubscribeUsers(); unsubscribeUsers = null; }
            try {
                const qU = query(collection(db, 'users'));
                unsubscribeUsers = onSnapshot(qU, (snapshot) => {
                    allUsers = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        allUsers.push({ id: doc.id, uid: doc.id, ...data });
                    });
                    allUsers.sort((a, b) => { const dA = a.createdAt?.toDate?.() || a.createdAt || 0; const dB = b.createdAt?.toDate?.() || b.createdAt || 0; return new Date(dB) - new Date(dA); });
                    if (currentTab === 'users') renderUsers();
                    if (currentTab === 'dashboard') renderDashboard();
                    if (currentUser) {
                        const updated = allUsers.find(u => u.id === currentUser.uid);
                        if (updated) { currentUserData = updated; updateProfileAvatar(); }
                    }
                }, (error) => handleAdminListenerError('Users', error, () => { allUsers = []; }));
            } catch (error) { console.warn('Users listener setup error:', error.message); }

            // REVIEWS (admin sees all — rules allow admin read)
            if (unsubscribeReviews) { unsubscribeReviews(); unsubscribeReviews = null; }
            try {
                const qR = query(collection(db, 'reviews'));
                unsubscribeReviews = onSnapshot(qR, (snapshot) => {
                    allReviews = [];
                    snapshot.forEach(doc => allReviews.push({ id: doc.id, ...doc.data() }));
                    allReviews.sort((a, b) => { const dA = a.createdAt?.toDate?.() || a.createdAt || 0; const dB = b.createdAt?.toDate?.() || b.createdAt || 0; return new Date(dB) - new Date(dA); });
                    if (currentTab === 'reviews') renderReviews();
                    if (currentTab === 'dashboard') renderDashboard();
                }, (error) => handleAdminListenerError('Reviews', error, () => { allReviews = []; }));
            } catch (error) { console.warn('Reviews listener setup error:', error.message); }

            // ANNOUNCEMENTS
            if (unsubscribeAnnouncements) { unsubscribeAnnouncements(); unsubscribeAnnouncements = null; }
            try {
                const qA = query(collection(db, 'announcements'));
                unsubscribeAnnouncements = onSnapshot(qA, (snapshot) => {
                    allAnnouncements = [];
                    snapshot.forEach(doc => allAnnouncements.push({ id: doc.id, ...doc.data() }));
                    if (currentTab === 'announcements') renderAnnouncements();
                    if (currentTab === 'dashboard') renderDashboard();
                }, (error) => handleAdminListenerError('Announcements', error, () => { allAnnouncements = []; }));
            } catch (error) { console.warn('Announcements listener setup error:', error.message); }
        }

        function cleanupListeners() {
            listenersActive = false;
            if (unsubscribeProducts) { unsubscribeProducts(); unsubscribeProducts = null; }
            if (unsubscribeCategories) { unsubscribeCategories(); unsubscribeCategories = null; }
            if (unsubscribeBanners) { unsubscribeBanners(); unsubscribeBanners = null; }
            if (unsubscribeOrders) { unsubscribeOrders(); unsubscribeOrders = null; }
            if (unsubscribeUsers) { unsubscribeUsers(); unsubscribeUsers = null; }
            if (unsubscribeReviews) { unsubscribeReviews(); unsubscribeReviews = null; }
            if (unsubscribeAnnouncements) { unsubscribeAnnouncements(); unsubscribeAnnouncements = null; }
        }

        /* ==================== AUTH GATE ==================== */
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (!user) {
                cleanupListeners();
                adminAuthorized = false;
                updateProfileAvatar();
                renderAdminLogin();
                return;
            }
            try {
                const docRef = doc(db, 'users', user.uid);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    currentUserData = docSnap.data();
                    currentUserData.emailVerified = user.emailVerified || false;
                    updateProfileAvatar();
                    if (currentUserData.role === 'admin' && currentUserData.status === 'active') {
                        adminAuthorized = true;
                        console.log('✅ Admin authorized — starting listeners');
                        setupListeners();
                        renderDashboard();
                    } else {
                        adminAuthorized = false;
                        cleanupListeners();
                        renderUnauthorized();
                    }
                } else {
                    currentUserData = { name: user.displayName || user.email?.split('@')[0] || 'User', role: 'customer', emailVerified: user.emailVerified || false };
                    adminAuthorized = false;
                    updateProfileAvatar();
                    cleanupListeners();
                    renderUnauthorized();
                }
            } catch (error) {
                if (error.code === 'permission-denied') {
                    console.warn('🔒 Admin check: user doc read denied');
                } else {
                    console.warn('⚠️ Admin check error:', error.message);
                }
                currentUserData = { name: user.displayName || user.email?.split('@')[0] || 'User', role: 'customer' };
                adminAuthorized = false;
                updateProfileAvatar();
                cleanupListeners();
                renderUnauthorized();
            }
        });

        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebarDrawer');
        const overlay = document.getElementById('sidebarOverlay');
        const closeBtn = document.getElementById('sidebarClose');
        menuToggle?.addEventListener('click', () => { sidebar.classList.add('open'); overlay.classList.add('open'); document.body.style.overflow = 'hidden'; });
        closeBtn?.addEventListener('click', () => { sidebar.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = ''; });
        overlay?.addEventListener('click', () => { sidebar.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = ''; });

        window.addEventListener('beforeunload', cleanupListeners);
    </script>
</body>
</html>
