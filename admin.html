<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
    <title>Sweet & Sour · Admin Dashboard</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="sticky-header">
        <div class="container">
            <div class="header-top">
                <div class="header-left">
                    <button class="hamburger" id="menuToggle" aria-label="Open menu"><i class="fas fa-bars"></i></button>
                </div>
                <div class="header-center">
                    <div class="brand-logo-placeholder">
                        <img src="logo.png" alt="Sweet & Sour Logo" id="brandLogo" onerror="this.style.display='none'" />
                    </div>
                </div>
                <div class="header-right">
                    <a href="account.html" class="icon-wrap account-icon" id="profileIcon" aria-label="Profile">
                        <div class="profile-avatar" id="profileAvatar">
                            <div class="avatar-initial" id="avatarInitial">A</div>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <nav class="sidebar-drawer" id="sidebarDrawer">
        <button class="sidebar-close" id="sidebarClose"><i class="fas fa-times"></i></button>
        <div class="drawer-brand"><span class="brand-sweet">Sweet</span><span class="brand-and">&amp;</span><span class="brand-sour">Sour</span></div>
        <ul class="drawer-nav">
            <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="categories.html"><i class="fas fa-th-large"></i> Categories</a></li>
            <li><a href="wishlist.html"><i class="far fa-heart"></i> Wishlist</a></li>
            <li><a href="cart.html"><i class="fas fa-shopping-bag"></i> Cart</a></li>
            <li><a href="account.html"><i class="far fa-user"></i> My Account</a></li>
            <li><a href="orders.html"><i class="fas fa-shopping-bag"></i> Orders</a></li>
            <li><a href="contact.html"><i class="fas fa-phone"></i> Contact</a></li>
            <li id="adminNavItem" style="display:none;"><a href="admin.html"><i class="fas fa-shield-alt"></i> Admin</a></li>
        </ul>
    </nav>

    <main id="adminMain">
        <div id="adminContainer">
            <div style="display:flex;justify-content:center;padding:3rem 0;"><div class="loading-spinner"></div></div>
        </div>
    </main>

    <div class="admin-modal-overlay" id="adminModal">
        <div class="admin-modal">
            <div class="modal-header">
                <h3 id="modalTitle">Modal</h3>
                <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <div class="upload-toast" id="uploadToast" style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--dark);color:white;padding:0.5rem 1.2rem;border-radius:var(--radius-full);font-size:0.8rem;z-index:999;box-shadow:var(--shadow-lg);display:none;"><span id="uploadStatus">Uploading...</span></div>
    <div class="toast-container" id="toast"></div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js"
            }
        }
    </script>

    <script type="module">
        import {
            auth, db,
            onAuthStateChanged, signOut,
            collection, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc,
            query, where, orderBy, onSnapshot, Timestamp,
            limit, sendPasswordResetEmail,
            IMGBB_API_KEY, uploadImageToImgBB, uploadMultipleImagesToImgBB, validateImageFile
        } from './firebase-config.js';

        const container = document.getElementById('adminContainer');
        const toast = document.getElementById('toast');
        const avatarInitial = document.getElementById('avatarInitial');
        const profileIcon = document.getElementById('profileIcon');
        const modal = document.getElementById('adminModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const modalClose = document.getElementById('modalClose');
        const uploadToast = document.getElementById('uploadToast');
        const uploadStatus = document.getElementById('uploadStatus');

        let toastTimer = null;
        let uploadToastTimer = null;
        let currentUser = null;
        let currentUserData = null;
        let currentTab = 'dashboard';
        let allProducts = [];
        let allCategories = [];
        let allOrders = [];
        let allUsers = [];
        let allBanners = [];
        let allReviews = [];
        let allAnnouncements = [];
        let userSearchQuery = '';
        let adminSidebarOpen = false;
        let adminAuthorized = false;

        let unsubscribeProducts = null;
        let unsubscribeCategories = null;
        let unsubscribeOrders = null;
        let unsubscribeUsers = null;
        let unsubscribeBanners = null;
        let unsubscribeReviews = null;
        let unsubscribeAnnouncements = null;

        let listenersActive = false;

        function showToast(message, type = 'success') {
            toast.textContent = message;
            toast.className = `toast-container ${type}`;
            toast.style.display = 'block';
            requestAnimationFrame(() => toast.classList.add('show'));
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.style.display = 'none', 400); }, 3000);
        }

        function showUploadToast(message, isUploading = true) {
            uploadStatus.textContent = message;
            uploadToast.style.display = 'block';
            if (!isUploading) { clearTimeout(uploadToastTimer); uploadToastTimer = setTimeout(() => { uploadToast.style.display = 'none'; }, 3000); }
        }
        function hideUploadToast() { uploadToast.style.display = 'none'; clearTimeout(uploadToastTimer); }

        function updateProfileAvatar() {
            if (!currentUser) { avatarInitial.textContent = 'U'; avatarInitial.className = 'avatar-initial'; profileIcon.href = 'login.html'; return; }
            profileIcon.href = 'account.html';
            if (currentUserData && currentUserData.role === 'admin') { avatarInitial.className = 'avatar-initial admin'; avatarInitial.textContent = 'A'; }
            else if (currentUserData && currentUserData.name) { avatarInitial.className = 'avatar-initial'; avatarInitial.textContent = currentUserData.name.charAt(0).toUpperCase(); }
            else if (currentUser.email) { avatarInitial.className = 'avatar-initial'; avatarInitial.textContent = currentUser.email.charAt(0).toUpperCase(); }
            else { avatarInitial.className = 'avatar-initial'; avatarInitial.textContent = 'U'; }
        }

        function isAdmin() { return currentUserData && currentUserData.role === 'admin' && currentUserData.status === 'active'; }

        function openModal(title, html) {
            modalTitle.textContent = title;
            modalBody.innerHTML = html;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeModal() { modal.classList.remove('active'); document.body.style.overflow = ''; hideUploadToast(); }
        modalClose.addEventListener('click', closeModal);
        modal.addEventListener('click', function(e) { if (e.target === this) closeModal(); });

        /* ==================== SIDEBAR MENU ==================== */
        const menuItems = [
            { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' },
            { id: 'products', label: 'Products', icon: 'fa-box' },
            { id: 'categories', label: 'Categories', icon: 'fa-tags' },
            { id: 'banners', label: 'Banners', icon: 'fa-images' },
            { id: 'orders', label: 'Orders', icon: 'fa-shopping-bag' },
            { id: 'users', label: 'Users', icon: 'fa-users' },
            { id: 'reviews', label: 'Reviews', icon: 'fa-star' },
            { id: 'announcements', label: 'Announcements', icon: 'fa-bullhorn' },
            { id: 'reports', label: 'Monthly Reports', icon: 'fa-chart-line' },
            { id: 'settings', label: 'Settings', icon: 'fa-cog' }
        ];

        function renderAdminLayout(contentHtml) {
            container.innerHTML = `
                <div class="admin-layout">
                    <div class="admin-sidebar-overlay" id="adminSidebarOverlay"></div>
                    <aside class="admin-sidebar" id="adminSidebar">
                        <div class="sidebar-brand">
                            <h3>Sweet <span>&</span> Sour</h3>
                            <p>Admin Panel</p>
                        </div>
                        <ul class="admin-nav">
                            ${menuItems.map(item => `
                                <li>
                                    <a href="#" class="${currentTab === item.id ? 'active' : ''}" data-tab="${item.id}">
                                        <i class="fas ${item.icon}"></i>
                                        <span>${item.label}</span>
                                    </a>
                                </li>
                            `).join('')}
                            <div class="nav-divider"></div>
                            <li>
                                <a href="#" id="adminLogoutNav" style="color:#D32F2F;">
                                    <i class="fas fa-sign-out-alt"></i>
                                    <span>Logout</span>
                                </a>
                            </li>
                        </ul>
                    </aside>
                    <div class="admin-main">
                        <button class="admin-mobile-toggle" id="adminMobileToggle">
                            <i class="fas fa-bars"></i> Menu
                        </button>
                        <div id="adminContent">${contentHtml}</div>
                    </div>
                </div>
            `;

            document.querySelectorAll('.admin-nav a[data-tab]').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    switchTab(this.dataset.tab);
                    closeAdminSidebar();
                });
            });

            document.getElementById('adminLogoutNav')?.addEventListener('click', async (e) => {
                e.preventDefault();
                try {
                    cleanupListeners();
                    await signOut(auth);
                    showToast('Logged out successfully', 'success');
                    setTimeout(() => { window.location.href = 'login.html'; }, 600);
                } catch (error) { showToast('Error logging out', 'error'); }
            });

            document.getElementById('adminMobileToggle')?.addEventListener('click', openAdminSidebar);
            document.getElementById('adminSidebarOverlay')?.addEventListener('click', closeAdminSidebar);

            attachTabListeners();
        }

        function openAdminSidebar() {
            document.getElementById('adminSidebar')?.classList.add('open');
            document.getElementById('adminSidebarOverlay')?.classList.add('active');
            adminSidebarOpen = true;
        }
        function closeAdminSidebar() {
            document.getElementById('adminSidebar')?.classList.remove('open');
            document.getElementById('adminSidebarOverlay')?.classList.remove('active');
            adminSidebarOpen = false;
        }

        function renderAdminLogin() {
            container.innerHTML = `<div class="admin-login-required"><i class="fas fa-lock"></i><h3>Admin Access Required</h3><p>Please login with an admin account to access the dashboard.</p><a href="login.html" class="btn-primary" style="margin-top:1rem;">Login</a></div>`;
        }
        function renderUnauthorized() {
            container.innerHTML = `<div class="admin-login-required"><i class="fas fa-exclamation-triangle" style="color:var(--primary-blue);"></i><h3>Unauthorized Access</h3><p>You do not have permission to access the admin dashboard.</p><a href="index.html" class="btn-primary" style="margin-top:1rem;">Return to Home</a></div>`;
        }

        /* ==================== DASHBOARD ==================== */
        function renderDashboard() {
            const stats = {
                totalProducts: allProducts.length,
                activeProducts: allProducts.filter(p => p.isActive !== false).length,
                totalCategories: allCategories.length,
                totalOrders: allOrders.length,
                pendingOrders: allOrders.filter(o => o.status === 'pending').length,
                deliveredOrders: allOrders.filter(o => o.status === 'delivered').length,
                cancelledOrders: allOrders.filter(o => o.status === 'cancelled').length,
                totalUsers: allUsers.length,
                totalReviews: allReviews.length,
                pendingReviews: allReviews.filter(r => r.status === 'pending').length,
                totalBanners: allBanners.length,
                totalAnnouncements: allAnnouncements.length
            };
            const html = `
                <div class="admin-stats">
                    <div class="admin-stat-card"><div class="stat-number">${stats.totalProducts}</div><div class="stat-label">Total Products</div></div>
                    <div class="admin-stat-card"><div class="stat-number">${stats.activeProducts}</div><div class="stat-label">Active Products</div></div>
                    <div class="admin-stat-card"><div class="stat-number">${stats.totalCategories}</div><div class="stat-label">Categories</div></div>
                    <div class="admin-stat-card"><div class="stat-number">${stats.totalOrders}</div><div class="stat-label">Total Orders</div></div>
                    <div class="admin-stat-card"><div class="stat-number">${stats.pendingOrders}</div><div class="stat-label">Pending Orders</div></div>
                    <div class="admin-stat-card"><div class="stat-number">${stats.deliveredOrders}</div><div class="stat-label">Delivered Orders</div></div>
                    <div class="admin-stat-card"><div class="stat-number">${stats.cancelledOrders}</div><div class="stat-label">Cancelled Orders</div></div>
                    <div class="admin-stat-card"><div class="stat-number">${stats.totalUsers}</div><div class="stat-label">Total Customers</div></div>
                    <div class="admin-stat-card"><div class="stat-number">${stats.totalReviews}</div><div class="stat-label">Total Reviews</div></div>
                    <div class="admin-stat-card"><div class="stat-number">${stats.pendingReviews}</div><div class="stat-label">Pending Reviews</div></div>
                    <div class="admin-stat-card"><div class="stat-number">${stats.totalBanners}</div><div class="stat-label">Banners</div></div>
                    <div class="admin-stat-card"><div class="stat-number">${stats.totalAnnouncements}</div><div class="stat-label">Announcements</div></div>
                </div>
                <div class="admin-panel">
                    <div class="panel-title">Welcome to Admin Dashboard</div>
                    <p style="color:var(--gray-500);">Manage your store from this dashboard. Use the menu on the left to navigate.</p>
                </div>
            `;
            renderAdminLayout(html);
        }

        /* ==================== PRODUCTS ==================== */
        function renderProducts() {
            const html = `
                <div class="admin-panel">
                    <div class="panel-title">
                        <span><i class="fas fa-box"></i> Products (${allProducts.length})</span>
                        <button class="btn-primary" id="addProductBtn" style="padding:0.3rem 1rem;font-size:0.85rem;"><i class="fas fa-plus"></i> Add Product</button>
                    </div>
                    <div style="overflow-x:auto;">
                        <table class="admin-table">
                            <thead><tr><th>Image</th><th>Name</th><th>SKU</th><th>Price</th><th>Category</th><th>Status</th><th>Actions</th></tr></thead>
                            <tbody>
                                ${allProducts.length === 0 ? `<tr><td colspan="7" style="text-align:center;color:var(--gray-500);padding:1.5rem;">No products found.</td></tr>` :
                                allProducts.map(p => {
                                    const sku = p.sku || p.SKU || p.productSku || p.productSKU || '—';
                                    return `
                                    <tr>
                                        <td><img src="${p.thumbnail || p.images?.[0]?.url || 'placeholder-product.jpg'}" style="width:40px;height:40px;object-fit:cover;border-radius:4px;" onerror="this.src='placeholder-product.jpg'" /></td>
                                        <td>${p.name}</td>
                                        <td>${sku !== '—' ? `<span style="font-size:0.7rem;background:var(--primary-blue-light);color:var(--primary-blue);padding:0.05rem 0.5rem;border-radius:var(--radius-full);font-weight:600;">${sku}</span>` : '—'}</td>
                                        <td>₹${p.price}</td>
                                        <td>${p.categoryName || 'N/A'}</td>
                                        <td><span class="status-badge ${p.isActive !== false ? 'active' : 'inactive'}">${p.isActive !== false ? 'Active' : 'Inactive'}</span></td>
                                        <td>
                                            <button class="btn-sm btn-edit" data-id="${p.id}">Edit</button>
                                            <button class="btn-sm btn-toggle" data-id="${p.id}">${p.isActive !== false ? 'Deactivate' : 'Activate'}</button>
                                            <button class="btn-sm btn-delete" data-id="${p.id}">Delete</button>
                                        </td>
                                    </tr>
                                `}).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            renderAdminLayout(html);

            document.getElementById('addProductBtn')?.addEventListener('click', () => showProductForm());
            document.querySelectorAll('.admin-table .btn-edit').forEach(btn => { btn.addEventListener('click', () => showProductForm(btn.dataset.id)); });
            document.querySelectorAll('.admin-table .btn-toggle').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.dataset.id;
                    const product = allProducts.find(p => p.id === id);
                    if (product) {
                        try { await updateDoc(doc(db, 'products', id), { isActive: product.isActive !== false ? false : true, updatedAt: Timestamp.now() }); showToast(`Product ${product.isActive !== false ? 'deactivated' : 'activated'}`, 'success'); }
                        catch (error) { showToast('Error updating product', 'error'); }
                    }
                });
            });
            document.querySelectorAll('.admin-table .btn-delete').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.dataset.id;
                    if (confirm('Are you sure you want to delete this product?')) {
                        try { await deleteDoc(doc(db, 'products', id)); showToast('Product deleted', 'success'); }
                        catch (error) { showToast('Error deleting product', 'error'); }
                    }
                });
            });
        }

        let editingProductId = null;
        let uploadedImages = [];
        let flavours = [];
        let selectedFiles = [];
        let isUploadingImages = false;

        function showProductForm(productId = null) {
            editingProductId = productId;
            const product = productId ? allProducts.find(p => p.id === productId) : null;
            if (productId && !product) { showToast('Product not found', 'error'); return; }

            uploadedImages = product?.images ? [...product.images] : [];
            flavours = product?.flavours ? [...product.flavours] : [];
            selectedFiles = [];

            const activeCategories = allCategories.filter(c => c.isActive !== false);
            const categoryOptions = activeCategories.map(c => `<option value="${c.id}" ${product?.categoryId === c.id ? 'selected' : ''}>${c.name}</option>`).join('');
            const flavourChips = flavours.map(f => `<span class="flavour-chip">${f} <span class="remove-flavour" data-flavour="${f}"><i class="fas fa-times"></i></span></span>`).join('');

            const existingImagePreviews = uploadedImages.map((img, idx) => `
                <div class="image-preview-item" data-image-index="${idx}">
                    <img src="${img.url}" alt="Product image" />
                    <div class="image-actions">
                        ${idx === 0 ? `<span class="set-main" style="background:rgba(26,140,255,0.8);color:white;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:0.6rem;"><i class="fas fa-check"></i></span>` :
                        `<button class="set-main" data-index="${idx}" title="Set as main"><i class="fas fa-star"></i></button>`}
                        <button class="remove-existing-img" data-index="${idx}" title="Remove"><i class="fas fa-trash"></i></button>
                    </div>
                    ${idx === 0 ? `<div class="main-badge">Main</div>` : ''}
                </div>
            `).join('');

            const pendingPreviews = selectedFiles.map((file, idx) => `
                <div class="image-preview-item" data-file-index="${idx}">
                    <img src="${URL.createObjectURL(file)}" alt="Uploading..." />
                    <div class="image-actions"><button class="remove-selected-img" data-fileindex="${idx}" title="Remove"><i class="fas fa-trash"></i></button></div>
                </div>
            `).join('');

            const modalHtml = `
                <form id="productForm" class="admin-form">
                    <div class="form-group full"><label for="pName">Product Name *</label><input type="text" id="pName" value="${product?.name || ''}" required /></div>
                    <div class="form-group"><label for="pSku">SKU</label><input type="text" id="pSku" value="${product?.sku || product?.SKU || ''}" placeholder="e.g. SS-ABC-1024" /></div>
                    <div class="form-group"><label for="pPrice">Price *</label><input type="number" id="pPrice" step="0.01" value="${product?.price || ''}" required /></div>
                    <div class="form-group"><label for="pOldPrice">Original Price</label><input type="number" id="pOldPrice" step="0.01" value="${product?.oldPrice || product?.salePrice || ''}" /></div>
                    <div class="form-group"><label for="pCategory">Category *</label><select id="pCategory" required><option value="">Select Category</option>${categoryOptions}</select></div>
                    <div class="form-group"><label for="pBrand">Brand</label><input type="text" id="pBrand" value="${product?.brand || ''}" /></div>
                    <div class="form-group full"><label for="pDescription">Description</label><textarea id="pDescription" rows="3">${product?.description || ''}</textarea></div>
                    <div class="form-group full">
                        <label>Flavours</label>
                        <div class="flavour-chips" id="flavourChips">${flavourChips}</div>
                        <div class="flavour-input-group">
                            <input type="text" id="flavourInput" placeholder="Add flavour (e.g. Chocolate)" />
                            <button type="button" id="addFlavourBtn">Add</button>
                        </div>
                    </div>
                    <div class="form-group full">
                        <label>Product Images (up to 100)</label>
                        <div class="image-upload-area" id="imageUploadArea">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>Click or drag & drop images here</p>
                            <span class="file-count">${uploadedImages.length + selectedFiles.length} / 100 images</span>
                            <span style="display:block;font-size:0.65rem;color:var(--gray-400);margin-top:0.2rem;">JPG, PNG, WEBP, GIF · Max 5MB each</span>
                        </div>
                        <input type="file" id="imageFileInput" accept="image/*" multiple style="display:none;" />
                        <div class="image-preview-grid" id="imagePreviewGrid">${existingImagePreviews}${pendingPreviews}</div>
                        <div class="upload-progress-container" id="uploadProgressContainer" style="display:none;">
                            <div class="progress-track"><div class="progress-fill" id="uploadProgressBar"></div></div>
                            <span class="progress-text" id="uploadProgressText">Uploading 0%</span>
                        </div>
                    </div>
                    <div class="form-group"><label for="pStatus">Status</label>
                        <select id="pStatus">
                            <option value="active" ${product?.isActive !== false ? 'selected' : ''}>Active</option>
                            <option value="inactive" ${product?.isActive === false ? 'selected' : ''}>Inactive</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary" id="productSubmitBtn">${productId ? 'Update' : 'Create'} Product</button>
                        <button type="button" class="btn-secondary" onclick="document.getElementById('adminModal').classList.remove('active');document.body.style.overflow='';">Cancel</button>
                    </div>
                </form>
            `;

            openModal(`${productId ? 'Edit' : 'Add'} Product`, modalHtml);

            document.getElementById('addFlavourBtn')?.addEventListener('click', () => {
                const input = document.getElementById('flavourInput');
                const val = input.value.trim();
                if (val && !flavours.includes(val)) { flavours.push(val); updateFlavourChips(); input.value = ''; }
            });
            document.getElementById('flavourInput')?.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); document.getElementById('addFlavourBtn')?.click(); } });

            function updateFlavourChips() {
                const c = document.getElementById('flavourChips');
                if (!c) return;
                c.innerHTML = flavours.map(f => `<span class="flavour-chip">${f} <span class="remove-flavour" data-flavour="${f}"><i class="fas fa-times"></i></span></span>`).join('');
                c.querySelectorAll('.remove-flavour').forEach(el => { el.addEventListener('click', function() { flavours = flavours.filter(f => f !== this.dataset.flavour); updateFlavourChips(); }); });
            }

            const uploadArea = document.getElementById('imageUploadArea');
            const fileInput = document.getElementById('imageFileInput');
            const progressContainer = document.getElementById('uploadProgressContainer');
            const progressBar = document.getElementById('uploadProgressBar');
            const progressText = document.getElementById('uploadProgressText');

            uploadArea?.addEventListener('click', () => { if (!isUploadingImages) fileInput?.click(); });
            uploadArea?.addEventListener('dragover', (e) => { e.preventDefault(); if (!isUploadingImages) uploadArea.classList.add('dragover'); });
            uploadArea?.addEventListener('dragleave', () => { uploadArea.classList.remove('dragover'); });
            uploadArea?.addEventListener('drop', (e) => { e.preventDefault(); uploadArea.classList.remove('dragover'); if (e.dataTransfer.files.length > 0) handleSelectedFiles(Array.from(e.dataTransfer.files)); });
            fileInput?.addEventListener('change', function() { if (this.files.length > 0) { handleSelectedFiles(Array.from(this.files)); this.value = ''; } });

            function handleSelectedFiles(files) {
                const imageFiles = files.filter(f => f.type.startsWith('image/'));
                if (imageFiles.length === 0) { showToast('Please select image files only', 'error'); return; }
                const validFiles = []; const invalidFiles = [];
                imageFiles.forEach(file => { const v = validateImageFile(file); if (v.valid) validFiles.push(file); else invalidFiles.push({ name: file.name, error: v.error }); });
                invalidFiles.forEach(f => showToast(`${f.name}: ${f.error}`, 'error'));
                if (validFiles.length > 0) {
                    const totalSlots = 100 - (uploadedImages.length + selectedFiles.length);
                    if (validFiles.length > totalSlots) { showToast(`Can only add ${totalSlots} more images`, 'error'); selectedFiles = [...selectedFiles, ...validFiles.slice(0, totalSlots)]; }
                    else selectedFiles = [...selectedFiles, ...validFiles];
                    updateImagePreviews();
                    showToast(`${validFiles.length} image(s) selected`, 'success');
                }
            }

            function updateImagePreviews() {
                const grid = document.getElementById('imagePreviewGrid');
                if (!grid) return;
                const existingHtml = uploadedImages.map((img, idx) => `
                    <div class="image-preview-item" data-image-index="${idx}">
                        <img src="${img.url}" alt="Product image" />
                        <div class="image-actions">
                            ${idx === 0 ? `<span class="set-main" style="background:rgba(26,140,255,0.8);color:white;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:0.6rem;"><i class="fas fa-check"></i></span>` :
                            `<button class="set-main" data-index="${idx}" title="Set as main"><i class="fas fa-star"></i></button>`}
                            <button class="remove-existing-img" data-index="${idx}" title="Remove"><i class="fas fa-trash"></i></button>
                        </div>
                        ${idx === 0 ? `<div class="main-badge">Main</div>` : ''}
                    </div>
                `).join('');
                const pendingHtml = selectedFiles.map((file, idx) => `
                    <div class="image-preview-item" data-file-index="${idx}">
                        <img src="${URL.createObjectURL(file)}" alt="Uploading..." />
                        <div class="image-actions"><button class="remove-selected-img" data-fileindex="${idx}" title="Remove"><i class="fas fa-trash"></i></button></div>
                    </div>
                `).join('');
                grid.innerHTML = existingHtml + pendingHtml;
                grid.querySelectorAll('.remove-existing-img').forEach(btn => { btn.addEventListener('click', function() { uploadedImages.splice(parseInt(this.dataset.index), 1); updateImagePreviews(); updateFileCount(); }); });
                grid.querySelectorAll('.remove-selected-img').forEach(btn => { btn.addEventListener('click', function() { selectedFiles.splice(parseInt(this.dataset.fileindex), 1); updateImagePreviews(); updateFileCount(); }); });
                grid.querySelectorAll('.set-main').forEach(btn => { btn.addEventListener('click', function() { const idx = parseInt(this.dataset.index); if (idx > 0 && uploadedImages.length > 0) { const img = uploadedImages.splice(idx, 1)[0]; uploadedImages.unshift(img); updateImagePreviews(); } }); });
                updateFileCount();
            }
            function updateFileCount() { const el = document.querySelector('.file-count'); if (el) el.textContent = `${uploadedImages.length + selectedFiles.length} / 100 images`; }

            document.getElementById('productForm')?.addEventListener('submit', async function(e) {
                e.preventDefault();
                if (isUploadingImages) { showToast('Please wait for images to finish uploading', 'warning'); return; }
                const name = document.getElementById('pName').value.trim();
                const sku = document.getElementById('pSku').value.trim();
                const price = parseFloat(document.getElementById('pPrice').value);
                const oldPrice = parseFloat(document.getElementById('pOldPrice').value) || 0;
                const categoryId = document.getElementById('pCategory').value;
                const brand = document.getElementById('pBrand').value.trim();
                const description = document.getElementById('pDescription').value.trim();
                const status = document.getElementById('pStatus').value;
                const isActive = status === 'active';
                if (!name || !price || !categoryId) { showToast('Please fill in all required fields', 'error'); return; }
                const category = allCategories.find(c => c.id === categoryId);
                const productData = {
                    name, sku, price, oldPrice: oldPrice > price ? oldPrice : 0,
                    categoryId, categoryName: category?.name || '',
                    brand, description, flavours, isActive, updatedAt: Timestamp.now()
                };
                const submitBtn = document.getElementById('productSubmitBtn');
                submitBtn.disabled = true;
                submitBtn.classList.add('btn-loading');
                submitBtn.innerHTML = '<span class="spinner"></span><span class="btn-text">Processing...</span>';
                try {
                    let productDocId = editingProductId;
                    if (!editingProductId) {
                        productData.createdAt = Timestamp.now();
                        const docRef = await addDoc(collection(db, 'products'), productData);
                        productDocId = docRef.id;
                        showToast('Product created, uploading images...', 'success');
                    } else {
                        await updateDoc(doc(db, 'products', editingProductId), productData);
                        showToast('Product updated, uploading images...', 'success');
                    }
                    if (selectedFiles.length > 0 && productDocId) {
                        isUploadingImages = true;
                        if (progressContainer) progressContainer.style.display = 'block';
                        let uploadedCount = 0;
                        const totalFiles = selectedFiles.length;
                        const uploadedImageData = [];
                        let uploadFailed = false;
                        for (let i = 0; i < selectedFiles.length; i++) {
                            const file = selectedFiles[i];
                            try {
                                showUploadToast(`Uploading image ${i+1}/${totalFiles}...`, true);
                                const result = await uploadImageToImgBB(file, (progress) => {
                                    if (progressBar) progressBar.style.width = `${((uploadedCount + (progress / 100)) / totalFiles) * 100}%`;
                                    if (progressText) progressText.textContent = `Uploading ${Math.round(progress)}% (${uploadedCount + 1}/${totalFiles})`;
                                });
                                uploadedImageData.push({ url: result.url, name: result.name, size: result.size, type: result.type });
                                uploadedCount++;
                                if (progressBar) progressBar.style.width = `${(uploadedCount / totalFiles) * 100}%`;
                                if (progressText) progressText.textContent = `Uploaded ${uploadedCount}/${totalFiles}`;
                            } catch (error) {
                                console.error('📸 ImgBB upload error:', error);
                                showToast(`Failed to upload ${file.name}: ${error.message}`, 'error');
                                uploadFailed = true;
                            }
                        }
                        hideUploadToast();
                        if (uploadFailed) showToast('Some images failed to upload.', 'warning');
                        const allImages = [...uploadedImages, ...uploadedImageData];
                        await updateDoc(doc(db, 'products', productDocId), {
                            images: allImages,
                            thumbnail: allImages.length > 0 ? allImages[0].url : '',
                            updatedAt: Timestamp.now()
                        });
                        isUploadingImages = false;
                        if (progressContainer) progressContainer.style.display = 'none';
                        if (uploadedCount > 0) showToast(`Uploaded ${uploadedCount} images successfully!`, 'success');
                    }
                    closeModal();
                    showToast(editingProductId ? 'Product updated successfully!' : 'Product created successfully!', 'success');
                } catch (error) {
                    console.error('❌ Error saving product:', error);
                    showToast('Error saving product: ' + (error.message || 'Unknown error'), 'error');
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('btn-loading');
                    submitBtn.innerHTML = editingProductId ? 'Update Product' : 'Create Product';
                    isUploadingImages = false;
                    if (progressContainer) progressContainer.style.display = 'none';
                    hideUploadToast();
                }
            });
        }

                    } else if (bannerId && bannerImageUrl) { data.image = bannerImageUrl; }
                    else if (!bannerId) { showToast('Please select a banner image', 'error'); submitBtn.disabled = false; submitBtn.classList.remove('btn-loading'); submitBtn.innerHTML = 'Create Banner'; return; }
                    if (bannerId) { await updateDoc(doc(db, 'banners', bannerId), data); showToast('Banner updated!', 'success'); }
                    else { data.createdAt = Timestamp.now(); await addDoc(collection(db, 'banners'), data); showToast('Banner created!', 'success'); }
                    closeModal();
                } catch (error) {
                    showToast('Error saving banner: ' + (error.message || 'Unknown error'), 'error');
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('btn-loading');
                    submitBtn.innerHTML = bannerId ? 'Update Banner' : 'Create Banner';
                }
            });
        }

        /* ==================== ORDERS ==================== */
        function renderOrders() {
            const html = `
                <div class="admin-panel">
                    <div class="panel-title"><span><i class="fas fa-shopping-bag"></i> Orders (${allOrders.length})</span></div>
                    <div style="overflow-x:auto;">
                        <table class="admin-table">
                            <thead><tr><th>Order ID</th><th>Customer</th><th>Total</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
                            <tbody>
                                ${allOrders.length === 0 ? `<tr><td colspan="6" style="text-align:center;color:var(--gray-500);padding:1.5rem;">No orders found.</td></tr>` :

                                    <tr>
                                        <td>${o.id}</td>
                                        <td>${o.customerName || o.customer || 'N/A'}</td>
                                        <td>₹${o.total || 0}</td>

                                            <button class="btn-sm btn-view" data-id="${o.id}">View</button>

                                            ${o.status !== 'delivered' && o.status !== 'cancelled' ? `<button class="btn-sm btn-deliver" data-id="${o.id}" data-action="deliver">Mark Delivered</button>` : ''}
                                            ${o.status !== 'cancelled' && o.status !== 'delivered' ? `<button class="btn-sm btn-cancel" data-id="${o.id}" data-action="cancel">Cancel</button>` : ''}

                                    </tr>
                                `).join('')}
                            </tbody>

                    </div>

            document.querySelectorAll('.admin-table .btn-view').forEach(btn => { btn.addEventListener('click', () => showOrderDetail(btn.dataset.id)); });
            document.querySelectorAll('.admin-table .btn-dispatch').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.dataset.id;
                    try { await updateDoc(doc(db, 'orders', id), { status: 'dispatched', updatedAt: Timestamp.now() }); showToast('Order dispatched', 'success'); }
                    catch (error) { showToast('Error updating status', 'error'); }
                });
            });
            document.querySelectorAll('.admin-table .btn-deliver').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.dataset.id;
                    try { await updateDoc(doc(db, 'orders', id), { status: 'delivered', updatedAt: Timestamp.now() }); showToast('Order marked delivered', 'success'); }
                    catch (error) { showToast('Error updating status', 'error'); }
                });
            });
            document.querySelectorAll('.admin-table .btn-cancel').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.dataset.id;
                    const order = allOrders.find(o => o.id === id);

                    openModal('Cancel Order', `
                        <div style="text-align:center;padding:1rem 0;">
                            <i class="fas fa-exclamation-triangle" style="font-size:2.5rem;color:#F59E0B;margin-bottom:0.8rem;"></i>
                            <h3 style="font-size:1.1rem;font-weight:700;margin-bottom:0.3rem;">Are you sure you want to cancel this order?</h3>
                            <p style="color:var(--gray-500);font-size:0.9rem;margin-bottom:1rem;">Order #${order.id} — ${order.customerName || 'Customer'}</p>
                            <div style="display:flex;gap:0.8rem;justify-content:center;">
                                <button class="btn-secondary" id="cancelOrderNo" style="padding:0.5rem 1.5rem;">No, Keep Order</button>
                                <button class="btn-primary" id="cancelOrderYes" style="padding:0.5rem 1.5rem;background:#D32F2F;">Yes, Cancel Order</button>
                            </div>
                        </div>
                    `);
                    document.getElementById('cancelOrderNo')?.addEventListener('click', closeModal);
                    document.getElementById('cancelOrderYes')?.addEventListener('click', async () => {
                        try {
                            await updateDoc(doc(db, 'orders', id), { status: 'cancelled', updatedAt: Timestamp.now() });
                            showToast('Order cancelled', 'success');
                            closeModal();
                        } catch (error) { showToast('Error cancelling order', 'error'); }
                    });
                });
            });
        }

        function showOrderDetail(orderId) {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) { showToast('Order not found', 'error'); return; }
            const items = order.items || [];
            const statusClass = order.status || 'pending';
            let itemsHtml = items.map(item => `
                <div style="display:flex;gap:0.8rem;padding:0.6rem 0;border-bottom:1px solid var(--gray-100);align-items:center;">
                    <img src="${item.image || 'placeholder-product.jpg'}" style="width:60px;height:60px;object-fit:contain;background:var(--gray-100);border-radius:6px;padding:4px;" onerror="this.src='placeholder-product.jpg'" />
                    <div style="flex:1;min-width:0;">
                        <div style="font-weight:600;font-size:0.9rem;">${item.name || 'Product'}</div>
                        <div style="font-size:0.75rem;color:var(--gray-500);">SKU: ${item.sku || 'N/A'} · Qty: ${item.qty || 1} · ₹${item.price || 0} each</div>
                    </div>
                    <div style="font-weight:700;font-size:0.9rem;color:var(--primary-blue);white-space:nowrap;">₹${(item.price || 0) * (item.qty || 1)}</div>

            const modalHtml = `
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;">

                        <p style="font-size:0.85rem;margin-bottom:0.3rem;"><strong>Order ID:</strong> ${order.id}</p>
                        <p style="font-size:0.85rem;margin-bottom:0.3rem;"><strong>Date:</strong> ${order.createdAt ? new Date(order.createdAt.toDate?.() || order.createdAt).toLocaleString() : 'N/A'}</p>
                        <p style="font-size:0.85rem;margin-bottom:0.3rem;"><strong>Status:</strong> <span class="status-badge ${statusClass}">${statusClass.charAt(0).toUpperCase() + statusClass.slice(1)}</span></p>
                        <p style="font-size:0.85rem;margin-bottom:0.3rem;"><strong>Total:</strong> ₹${order.total || 0}</p>
                        ${order.discount ? `<p style="font-size:0.85rem;margin-bottom:0.3rem;"><strong>Discount:</strong> -₹${order.discount}</p>` : ''}
                        <p style="font-size:0.85rem;margin-bottom:0.3rem;"><strong>Delivery:</strong> ${typeof order.delivery === 'number' ? (order.delivery === 0 ? 'FREE' : '₹'+order.delivery) : (order.delivery || 'To be confirmed')}</p>
                    </div>
                    <div style="background:var(--gray-50);border-radius:var(--radius-sm);padding:1rem;">
                        <h4 style="font-weight:700;font-size:0.9rem;margin-bottom:0.6rem;color:var(--dark-text);"><i class="fas fa-user" style="color:var(--primary-blue);"></i> Customer Details</h4>
                        <p style="font-size:0.85rem;margin-bottom:0.3rem;"><strong>Name:</strong> ${order.customerName || order.customer || 'N/A'}</p>
                        <p style="font-size:0.85rem;margin-bottom:0.3rem;"><strong>Phone:</strong> ${order.phone || 'N/A'}</p>
                        ${order.email ? `<p style="font-size:0.85rem;margin-bottom:0.3rem;"><strong>Email:</strong> ${order.email}</p>` : ''}
                        <p style="font-size:0.85rem;margin-bottom:0.3rem;"><strong>Address:</strong> ${order.address || 'N/A'}</p>
                        ${order.area ? `<p style="font-size:0.85rem;margin-bottom:0.3rem;"><strong>Area:</strong> ${order.area}</p>` : ''}
                        <p style="font-size:0.85rem;margin-bottom:0.3rem;"><strong>City:</strong> ${order.city || 'N/A'}${order.state ? ', '+order.state : ''}</p>
                        <p style="font-size:0.85rem;margin-bottom:0.3rem;"><strong>Pincode:</strong> ${order.pincode || 'N/A'}</p>
                    </div>
                </div>
                <div style="margin-top:1rem;">
                    <h4 style="font-weight:700;font-size:0.9rem;margin-bottom:0.6rem;color:var(--dark-text);"><i class="fas fa-box" style="color:var(--primary-blue);"></i> Products (${items.length})</h4>
                    ${itemsHtml || '<p style="color:var(--gray-500);font-size:0.85rem;">No items</p>'}
                </div>
            `;
            openModal(`Order #${order.id}`, modalHtml);
        }

        /* ==================== USERS ==================== */
        function renderUsers() {
            const filteredUsers = userSearchQuery ? allUsers.filter(u => {
                const q = userSearchQuery.toLowerCase();
                return (u.name && u.name.toLowerCase().includes(q)) ||
                       (u.email && u.email.toLowerCase().includes(q)) ||
                       (u.phone && u.phone.includes(q)) ||
                       (u.uid && u.uid.includes(q));
            }) : allUsers;

            const html = `
                <div class="admin-panel">
                    <div class="panel-title"><span><i class="fas fa-users"></i> Users (${filteredUsers.length})</span></div>
                    <div class="admin-search">
                        <input type="text" id="userSearchInput" placeholder="Search by name, email, phone or UID..." value="${userSearchQuery}" />
                        <button class="btn-primary" id="userSearchBtn"><i class="fas fa-search"></i> Search</button>
                        ${userSearchQuery ? `<button class="btn-secondary" id="userClearSearchBtn"><i class="fas fa-times"></i> Clear</button>` : ''}
                    </div>
                    <div style="overflow-x:auto;">
                        <table class="admin-table">
                            <thead><tr><th>User</th><th>Email</th><th>Phone</th><th>Role</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead>
                            <tbody>
                                ${filteredUsers.length === 0 ? `<tr><td colspan="7" style="text-align:center;color:var(--gray-500);padding:1.5rem;">${userSearchQuery ? 'No users match your search.' : 'No users found.'}</td></tr>` :
                                filteredUsers.map(u => `
                                    <tr>
                                        <td><strong>${u.name || 'N/A'}</strong><br><span style="font-size:0.6rem;color:var(--gray-400);">${u.uid || u.id}</span></td>
                                        <td>${u.email || 'N/A'}</td>
                                        <td>${u.phone || 'N/A'}</td>
                                        <td><span class="status-badge ${u.role === 'admin' ? 'admin' : 'customer'}">${u.role || 'customer'}</span></td>
                                        <td><span class="status-badge ${u.status === 'active' ? 'active' : 'inactive'}">${u.status || 'active'}</span></td>
                                        <td>${u.createdAt ? new Date(u.createdAt.toDate?.() || u.createdAt).toLocaleDateString() : 'N/A'}</td>
                                        <td>
                                            <button class="btn-sm btn-view" data-id="${u.uid || u.id}">View</button>
                                            <button class="btn-sm btn-toggle" data-id="${u.uid || u.id}">${u.status !== 'inactive' ? 'Deactivate' : 'Activate'}</button>
                                            <button class="btn-sm btn-reset" data-id="${u.uid || u.id}" data-email="${u.email || ''}">Reset Pwd</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            renderAdminLayout(html);

            document.getElementById('userSearchBtn')?.addEventListener('click', function() { userSearchQuery = document.getElementById('userSearchInput').value.trim(); renderUsers(); });
            document.getElementById('userSearchInput')?.addEventListener('keydown', function(e) { if (e.key === 'Enter') { userSearchQuery = this.value.trim(); renderUsers(); } });
            document.getElementById('userClearSearchBtn')?.addEventListener('click', function() { userSearchQuery = ''; renderUsers(); });

            document.querySelectorAll('.admin-table .btn-view').forEach(btn => { btn.addEventListener('click', () => showUserDetail(btn.dataset.id)); });
            document.querySelectorAll('.admin-table .btn-toggle').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.dataset.id;
                    const user = allUsers.find(u => (u.uid || u.id) === id);
                    if (user) {
                        try { const newStatus = user.status !== 'inactive' ? 'inactive' : 'active'; await updateDoc(doc(db, 'users', id), { status: newStatus, updatedAt: Timestamp.now() }); showToast(`User ${newStatus === 'active' ? 'activated' : 'deactivated'}`, 'success'); }
                        catch (error) { showToast('Error updating user', 'error'); }
                    }
                });
            });
            document.querySelectorAll('.admin-table .btn-reset').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const email = btn.dataset.email;
                    if (!email) { showToast('User has no email address', 'error'); return; }
                    if (confirm(`Send password reset email to ${email}?`)) {
                        try { await sendPasswordResetEmail(auth, email); showToast(`Password reset email sent to ${email}`, 'success'); }
                        catch (error) { showToast('Failed to send password reset email.', 'error'); }
                    }
                });
            });
        }

        function showUserDetail(userId) {
            const user = allUsers.find(u => (u.uid || u.id) === userId);
            if (!user) { showToast('User not found', 'error'); return; }
            const userOrders = allOrders.filter(o => o.customerId === userId || o.customerId === user.uid);
            const totalOrders = userOrders.length;
            const totalAmount = userOrders.reduce((sum, o) => sum + (o.total || 0), 0);
            const pendingOrders = userOrders.filter(o => o.status === 'pending').length;
            let ordersHtml = userOrders.length === 0 ? '<p style="color:var(--gray-500);">No orders</p>' :
                userOrders.map(o => `<div class="order-item-modal"><span>#${o.id}</span><span>₹${o.total || 0}</span><span class="status-badge ${o.status || 'pending'}">${(o.status || 'pending').charAt(0).toUpperCase() + (o.status || 'pending').slice(1)}</span></div>`).join('');

            const modalHtml = `
                <div class="user-detail-grid">
                    <div class="detail-item"><strong>Name:</strong> ${user.name || 'N/A'}</div>
                    <div class="detail-item"><strong>Email:</strong> ${user.email || 'N/A'}</div>
                    <div class="detail-item"><strong>Phone:</strong> ${user.phone || 'N/A'}</div>
                    <div class="detail-item"><strong>Role:</strong> <span class="status-badge ${user.role === 'admin' ? 'admin' : 'customer'}">${user.role || 'customer'}</span></div>
                    <div class="detail-item"><strong>Status:</strong> <span class="status-badge ${user.status === 'active' ? 'active' : 'inactive'}">${user.status || 'active'}</span></div>
                    <div class="detail-item"><strong>Joined:</strong> ${user.createdAt ? new Date(user.createdAt.toDate?.() || user.createdAt).toLocaleDateString() : 'N/A'}</div>
                    <div class="detail-item" style="grid-column:1/-1;"><strong>UID:</strong> <span style="font-size:0.7rem;color:var(--gray-500);word-break:break-all;">${user.uid || user.id}</span></div>
                </div>
                <div style="margin-top:1rem;padding-top:1rem;border-top:1px solid var(--gray-200);">
                    <h4 style="font-weight:600;margin-bottom:0.3rem;">Order Summary</h4>
                    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.5rem;margin-bottom:0.8rem;">
                        <div style="background:var(--gray-50);padding:0.5rem;border-radius:var(--radius-sm);text-align:center;"><div style="font-size:1.2rem;font-weight:700;color:var(--primary-blue);">${totalOrders}</div><div style="font-size:0.7rem;color:var(--gray-500);">Total Orders</div></div>
                        <div style="background:var(--gray-50);padding:0.5rem;border-radius:var(--radius-sm);text-align:center;"><div style="font-size:1.2rem;font-weight:700;color:#F59E0B;">${pendingOrders}</div><div style="font-size:0.7rem;color:var(--gray-500);">Pending</div></div>
                        <div style="background:var(--gray-50);padding:0.5rem;border-radius:var(--radius-sm);text-align:center;"><div style="font-size:1.2rem;font-weight:700;color:var(--accent);">₹${totalAmount}</div><div style="font-size:0.7rem;color:var(--gray-500);">Total Spent</div></div>
                    </div>
                    <h4 style="font-weight:600;margin-bottom:0.3rem;">Order History</h4>
                    <div class="orders-list-in-modal">${ordersHtml}</div>
                </div>
            `;
            openModal(`User: ${user.name || 'N/A'}`, modalHtml);
        }

        /* ==================== REVIEWS ==================== */
        function renderReviews() {
            const html = `
                <div class="admin-panel">
                    <div class="panel-title"><span><i class="fas fa-star"></i> Reviews (${allReviews.length})</span></div>
                    <div style="overflow-x:auto;">
                        <table class="admin-table">
                            <thead><tr><th>Product</th><th>User</th><th>Rating</th><th>Review</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
                            <tbody>
                                ${allReviews.length === 0 ? `<tr><td colspan="7" style="text-align:center;color:var(--gray-500);padding:1.5rem;">No reviews found.</td></tr>` :
                                allReviews.map(r => `
                                    <tr>
                                        <td style="font-size:0.8rem;">${r.productName || 'N/A'}</td>
                                        <td style="font-size:0.8rem;">${r.userName || 'User'}<br><span style="font-size:0.65rem;color:var(--gray-400);">${r.userEmail || ''}</span></td>
                                        <td style="color:#F59E0B;font-size:0.9rem;white-space:nowrap;">${'★'.repeat(r.rating || 0)}${'☆'.repeat(5 - (r.rating || 0))}</td>
                                        <td style="max-width:200px;font-size:0.75rem;">${(r.text || '').substring(0, 80)}${(r.text || '').length > 80 ? '...' : ''}</td>
                                        <td style="font-size:0.75rem;">${r.createdAt ? new Date(r.createdAt.toDate?.() || r.createdAt).toLocaleDateString() : 'N/A'}</td>
                                        <td><span class="status-badge ${r.status === 'approved' ? 'active' : r.status === 'rejected' ? 'inactive' : 'pending'}">${r.status || 'pending'}</span></td>
                                        <td style="white-space:nowrap;">
                                            ${r.status !== 'approved' ? `<button class="btn-sm btn-view" data-id="${r.id}" data-action="approve" style="background:#D1FAE5;color:#065F46;">Approve</button>` : ''}
                                            ${r.status !== 'rejected' ? `<button class="btn-sm btn-edit" data-id="${r.id}" data-action="reject" style="background:#FEF3C7;color:#92400E;">Reject</button>` : ''}
                                            <button class="btn-sm btn-delete" data-id="${r.id}" data-action="delete">Delete</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            renderAdminLayout(html);

            document.querySelectorAll('.admin-table button[data-action]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.dataset.id;
                    const action = btn.dataset.action;
                    try {
                        if (action === 'approve') {
                            await updateDoc(doc(db, 'reviews', id), { status: 'approved', updatedAt: Timestamp.now() });
                            showToast('Review approved', 'success');
                        } else if (action === 'reject') {
                            await updateDoc(doc(db, 'reviews', id), { status: 'rejected', updatedAt: Timestamp.now() });
                            showToast('Review rejected', 'success');
                        } else if (action === 'delete') {
                            if (confirm('Delete this review?')) {
                                await deleteDoc(doc(db, 'reviews', id));
                                showToast('Review deleted', 'success');
                            }
                        }
                    } catch (error) {
                        console.error(error);
                        showToast('Error updating review', 'error');
                    }
                });
            });
        }

                btn.addEventListener('click', async () => {
                    const id = btn.dataset.id;
                    const item = allAnnouncements.find(a => a.id === id);
                    if (item) {
                        try { await updateDoc(doc(db, 'announcements', id), { isActive: item.isActive !== false ? false : true, updatedAt: Timestamp.now() }); showToast(`Announcement ${item.isActive !== false ? 'deactivated' : 'activated'}`, 'success'); }
                        catch (error) { showToast('Error updating announcement', 'error'); }
                    }
                });
            });
            document.querySelectorAll('.admin-table .btn-delete').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.dataset.id;
                    if (confirm('Delete this announcement?')) {
                        try { await deleteDoc(doc(db, 'announcements', id)); showToast('Announcement deleted', 'success'); }
                        catch (error) { showToast('Error deleting announcement', 'error'); }
